services:
  synkk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synkk-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:80"
    env_file:
      - .env
    environment:
      APP_NAME: "Synkk Vault Sync"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      # APP_KEY must be set in your environment or .env file.
      # Generate with: php artisan key:generate --show
      APP_KEY: "${APP_KEY:?APP_KEY is required. Generate with: php artisan key:generate --show}"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/storage/app/database.sqlite"
      QUEUE_CONNECTION: "database"
      CACHE_STORE: "database"
      SESSION_DRIVER: "database"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SYNKK_STORAGE_DISK: "local"
      REVERB_SERVER_HOST: "127.0.0.1"
      REVERB_SERVER_PORT: "8080"
      REVERB_HOST: "127.0.0.1"
      REVERB_PORT: "8080"
      REVERB_SCHEME: "http"
      REVERB_APP_ID: "${REVERB_APP_ID:?REVERB_APP_ID is required}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:?REVERB_APP_KEY is required}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}"
      SYNKK_BOOTSTRAP_EMAIL: "${SYNKK_BOOTSTRAP_EMAIL:-}"
      SYNKK_BOOTSTRAP_PASSWORD: "${SYNKK_BOOTSTRAP_PASSWORD:-}"
      SYNKK_BOOTSTRAP_NAME: "${SYNKK_BOOTSTRAP_NAME:-}"
    volumes:
      - synkk_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  synkk_storage:
