services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: synkk/app:latest
    container_name: synkk_app
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/app/database.sqlite
      # Ensure other secrets like APP_KEY, mail settings, etc. are passed via env file
    volumes:
      - synkk_storage:/var/www/html/storage
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  synkk_storage:
