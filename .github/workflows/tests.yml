name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Validate Obsidian plugin
        run: |
          npm ci --prefix obsidian-plugin
          npm --prefix obsidian-plugin run build
          npx --prefix obsidian-plugin tsc --project obsidian-plugin/tsconfig.json --noEmit --skipLibCheck
          npm run test:js

      - name: Audit production dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --omit=dev --audit-level=high
          npm audit --prefix obsidian-plugin --omit=dev --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

      - name: Build production container
        run: docker build --tag synkk-ci:${{ github.sha }} .
