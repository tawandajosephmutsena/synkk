name: Publish container

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Build container
        run: docker build --tag synkk-release-smoke:${{ github.sha }} .

      - name: Start container and check HTTP health
        run: |
          if docker run --rm --env APP_KEY=base64:GENERATE_ME_USING_INSTALL_SCRIPT synkk-release-smoke:${{ github.sha }} /bin/true; then
            echo "Container accepted an invalid APP_KEY" >&2
            exit 1
          fi
          docker volume create synkk-release-storage >/dev/null
          trap 'docker rm --force synkk-release-smoke >/dev/null 2>&1 || true; docker volume rm synkk-release-storage >/dev/null 2>&1 || true' EXIT
          start_container() {
            docker run --detach --name synkk-release-smoke \
              --publish 127.0.0.1:18080:80 \
              --volume synkk-release-storage:/var/www/html/storage \
              --env APP_ENV=production \
              --env APP_DEBUG=false \
              --env APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
              --env QUEUE_CONNECTION=database \
              --env CACHE_STORE=database \
              --env SESSION_DRIVER=database \
              --env REVERB_APP_ID=synkk-ci \
              --env REVERB_APP_KEY=synkk-ci-key \
              --env REVERB_APP_SECRET=synkk-ci-secret \
              --env REVERB_HOST=127.0.0.1 \
              --env REVERB_PORT=8080 \
              --env REVERB_SCHEME=http \
              --env SYNKK_BOOTSTRAP_EMAIL=admin@example.test \
              --env SYNKK_BOOTSTRAP_PASSWORD=SecurePass123!@# \
              synkk-release-smoke:${{ github.sha }}
          }
          start_container
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/up || { docker logs synkk-release-smoke; exit 1; }
          container_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' synkk-release-smoke)"
          test -n "$container_ip"
          docker exec synkk-release-smoke php -r '
            $loopback = @fsockopen("127.0.0.1", 9000, $errno, $error, 1);
            if ($loopback === false) { fwrite(STDERR, "PHP-FPM is not reachable on loopback.\n"); exit(1); }
            fclose($loopback);
            $network = @fsockopen($argv[1], 9000, $errno, $error, 1);
            if ($network !== false) { fclose($network); fwrite(STDERR, "PHP-FPM is exposed on the container network.\n"); exit(1); }
          ' "$container_ip"
          test "$(docker exec synkk-release-smoke sqlite3 /var/www/html/storage/app/database.sqlite \
            "SELECT COUNT(*) FROM users WHERE email='admin@example.test' AND is_super_admin=1 AND email_verified_at IS NOT NULL;")" = 1
          password_hash_before="$(docker exec synkk-release-smoke sqlite3 /var/www/html/storage/app/database.sqlite \
            "SELECT password FROM users WHERE email='admin@example.test';")"
          docker rm --force synkk-release-smoke >/dev/null
          start_container
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/up || { docker logs synkk-release-smoke; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:18080/login >/dev/null
          test "$(docker exec synkk-release-smoke sqlite3 /var/www/html/storage/app/database.sqlite \
            "SELECT COUNT(*) FROM users WHERE email='admin@example.test' AND is_super_admin=1 AND email_verified_at IS NOT NULL;")" = 1
          test "$password_hash_before" = "$(docker exec synkk-release-smoke sqlite3 /var/www/html/storage/app/database.sqlite \
            "SELECT password FROM users WHERE email='admin@example.test';")"
          for attempt in $(seq 1 20); do
            if python3 -c 'import socket; s=socket.create_connection(("127.0.0.1", 18080), timeout=5); s.sendall(b"GET /app/synkk-ci-key?protocol=7&client=js&version=8.6.0&flash=false HTTP/1.1\r\nHost: 127.0.0.1:18080\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n"); response=s.recv(512); s.close(); assert response.startswith(b"HTTP/1.1 101"), response'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then docker logs synkk-release-smoke; exit 1; fi
            sleep 1
          done

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

  verify-public:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify anonymous manifest and pull
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker_config_dir="$(mktemp -d)"
          trap 'rm -rf "$docker_config_dir"' EXIT
          DOCKER_CONFIG="$docker_config_dir" docker manifest inspect "$IMAGE" >/dev/null
          DOCKER_CONFIG="$docker_config_dir" docker pull "$IMAGE"
